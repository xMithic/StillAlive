<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Still Alive</title>
<style>
  :root{--fg:#ffb000;--bg:#000}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:"Courier New",Consolas,monospace;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;text-shadow:0 0 5px rgba(255,176,0,.55)}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px)}
  #screen{display:grid;grid-template-columns:51ch 51ch;grid-template-rows:16em 20em;
    line-height:1;font-size:var(--fs,16px)}
  pre{margin:0;font:inherit;line-height:1}
  #lyrics{grid-row:1/3;border:1px solid var(--fg);padding:1em 1ch;overflow:hidden}
  #credits{border:1px solid var(--fg);border-left:0}
  #art{padding-left:6ch;padding-top:0}
  .cur{display:inline-block;width:1ch;height:1em;vertical-align:text-bottom;background:var(--fg);
    animation:b 1s steps(1) infinite}
  @keyframes b{50%{opacity:0}}
  #start{position:fixed;inset:0;z-index:5;background:#000;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:1em;cursor:pointer;text-align:center}
  #start b{letter-spacing:.25em;font-size:1.5rem}
  #start small{opacity:.65}
  
  /* Contenedor del botón a la izquierda (oculto por defecto) */
  #lang-container{position:fixed;left:2.5rem;top:50%;transform:translateY(-50%);z-index:20;
    display:flex;flex-direction:column;gap:0.4em;align-items:flex-start;
    display: none; opacity: 0; transition: opacity 1.5s ease;}
  #lang-container.show { display: flex; opacity: 1; }

  #btn-translate{
    font-family:inherit; font-size:1rem; color:var(--fg); background:#000;
    border:1px solid var(--fg); padding:0.6em 1.2ch; cursor:pointer;
    text-shadow:0 0 5px rgba(255,176,0,.55); letter-spacing:.15em; text-transform:uppercase;
    box-shadow:0 0 10px rgba(255,176,0,.2);
    /* Transición suave tanto al entrar como al salir del estado presionado */
    transition: background 0.3s ease, color 0.3s ease, box-shadow 0.3s ease, text-shadow 0.3s ease, transform .2s ease;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  
  /* En PC el hover normal de escritorio */
  @media (hover: hover) {
    #btn-translate:hover{background:var(--fg);color:#000;box-shadow:0 0 18px rgba(255,176,0,.7);text-shadow:none}
  }

  /* El botón se pone naranja instantáneamente y de forma suave cuando se MANTIENE presionado (tanto en PC como al tocar la pantalla táctil) */
  #btn-translate:active {
    background: var(--fg) !important;
    color: #000 !important;
    box-shadow: 0 0 18px rgba(255,176,0,.7) !important;
    text-shadow: none !important;
    transform: scale(.95);
  }

  @media (max-width: 900px){
    #lang-container{left:1rem;top:1rem;transform:none}
  }

  /* Onda luminosa de letras al traducir */
  .wave-char{color:#fff;text-shadow:0 0 6px #fff, 0 0 12px #ffb000, 0 0 22px #ffb000;
    font-weight:bold;display:inline-block}
</style>
</head>
<body>
<div id="lang-container">
  <button id="btn-translate" type="button">Traducir</button>
</div>
<div id="start"><b>CONTINUAR</b><span>[ para iniciar ]</span><small id="warn"></small></div>
<div id="screen">
  <pre id="lyrics"></pre>
  <pre id="credits"></pre>
  <pre id="art"></pre>
</div>
<audio id="song" src="still-alive.flac" preload="auto"></audio>
<script src="art.js"></script>
<script src="lyrics.js"></script>
<script src="lyrics-es.js"></script>
<script>
/* =========================================================================
   AJUSTES PRINCIPALES
   ========================================================================= */
const OFFSET_MS = 0;              // Retraso general de sincronización
const AUDIO_DELAY_MS = 6750;      // Milisegundos para que empiece a sonar la música
const BUTTON_DELAY_MS = 8000;     // Milisegundos para que aparezca el botón de traducir (8s)
/* ========================================================================= */

const q = new URLSearchParams(location.search);
const $ = s => document.querySelector(s);
const audio = $("#song");
let audioOk = true;
audio.addEventListener("error", () => { audioOk = false; $("#warn").textContent = "No se encontró still-alive.flac (se mostrará solo la letra)"; });

/* Escala el tamaño para que los caracteres quepan en pantalla */
function fit(){
  const fs = Math.min(16, innerWidth / 104 / 0.6, innerHeight / 38);
  $("#screen").style.setProperty("--fs", fs + "px");
}
addEventListener("resize", fit); fit();

/* Cuadro de créditos */
function put(grid,r,c,s){ grid[r] = grid[r].slice(0,c) + s + grid[r].slice(c+s.length); }
(function(){
  const g = Array.from({length:16}, () => " ".repeat(49));
  put(g,2,14,"STILL ALIVE");
  put(g,4,10,"Played by motherboard buzzer");
  put(g,13,1,"Still Alive - Dmitry Kotov");
  put(g,14,1,"by Miguel");
  $("#credits").textContent = g.join("\n");
})();

function SPEED_VAL(){ return +(q.get("speed") ?? 1); }

/* Línea de tiempo para inglés y español */
function createTimeline(rawLyrics){
  let totalMs = 0;
  const list = rawLyrics.map(e => {
    let text = e.text, image = null, clear = false, m;
    while (true) {
      if ((m = /^\u0001(\w+)\u0002/.exec(text))) { image = m[1]; text = text.slice(m[0].length); }
      else if (text[0] === "\u0003") { clear = true; text = text.slice(1); }
      else break;
    }
    const o = { text, image, clear, start: totalMs, dur: e.ms * SPEED_VAL() };
    totalMs += o.dur; return o;
  });
  return { list, total: totalMs };
}

const timelineEn = createTimeline(lyrics);
const timelineEs = createTimeline(typeof lyrics_es !== "undefined" ? lyrics_es : lyrics);
const ev_en = timelineEn.list;
const ev_es = timelineEs.list;
const total = timelineEn.total;

function renderTimeline(timeline, t){
  let from = 0, img = null, out = "";
  for (let i = 0; i < timeline.length && timeline[i].start <= t; i++){
    if (timeline[i].clear) { from = i; img = null; }
    if (timeline[i].image) img = timeline[i].image;
  }
  for (let i = from; i < timeline.length && timeline[i].start <= t; i++){
    const e = timeline[i], n = e.text.length;
    if (n) {
      const chars = e.dur <= 0 ? n : Math.min(n, Math.floor((t - e.start) / (e.dur / n)) + 1);
      out += e.text.slice(0, chars);
    }
  }
  return [out, img];
}

/* Estado de idioma y transición */
let currentLang = "en"; // "en" | "es"
let isTransitioning = false;
let transStartTime = 0;
let transFrom = "en";
let transTo = "es";
const TRANS_DURATION = 1250; // 1.25 segundos para la onda completa
const GLYPHS = "0123456789ABCDEF$#@%*+=-/;:?<>!~";

function escapeHtml(s){
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function waveTransform(txtFrom, txtTo, progress){
  const linesFrom = txtFrom.split("\n");
  const linesTo = txtTo.split("\n");
  const maxLines = Math.max(linesFrom.length, linesTo.length);
  const waveWidth = 5;
  const angleStagger = 0.8;
  
  let maxCol = 30;
  for (let r = 0; r < maxLines; r++){
    const l1 = (linesFrom[r] || "").length;
    const l2 = (linesTo[r] || "").length;
    if (l1 > maxCol) maxCol = l1;
    if (l2 > maxCol) maxCol = l2;
  }

  const maxEffX = maxCol + Math.max(0, maxLines - 1) * angleStagger;
  const totalRange = maxEffX + waveWidth * 2;
  const waveFront = progress * totalRange - waveWidth;

  const outLines = [];
  for (let r = 0; r < maxLines; r++){
    const sFrom = linesFrom[r] || "";
    const sTo = linesTo[r] || "";
    const len = Math.max(sFrom.length, sTo.length);
    let lineHtml = "";

    for (let c = 0; c < len; c++){
      const effX = c + r * angleStagger;
      const dist = waveFront - effX;

      if (dist < 0){
        if (c < sFrom.length) lineHtml += escapeHtml(sFrom[c]);
      } else if (dist < waveWidth){
        const glyph = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
        lineHtml += `<span class="wave-char">${escapeHtml(glyph)}</span>`;
      } else {
        if (c < sTo.length) lineHtml += escapeHtml(sTo[c]);
      }
    }
    outLines.push(lineHtml);
  }
  return outLines.join("\n");
}

function toggleLang(){
  const nextLang = (currentLang === "en") ? "es" : "en";
  transFrom = currentLang;
  transTo = nextLang;
  currentLang = nextLang;
  isTransitioning = true;
  transStartTime = performance.now();

  const btn = $("#btn-translate");
  if (btn){
    btn.textContent = (currentLang === "es") ? "Deshacer" : "Traducir";
    btn.setAttribute("title", (currentLang === "es") ? "Volver a inglés" : "Traducir a español");
  }
}

$("#btn-translate").addEventListener("click", e => {
  e.stopPropagation();
  toggleLang();
});

addEventListener("keydown", e => {
  if (e.key === "t" || e.key === "T") toggleLang();
});

let t0 = 0, last = "";
function frame(now){
  const elapsed = now - t0;
  const t = elapsed - OFFSET_MS;
  const done = t > total;
  
  if (t >= 0){
    const [txt_en, img] = renderTimeline(ev_en, t);
    const [txt_es] = renderTimeline(ev_es, t);

    let html = "";
    if (isTransitioning){
      const progress = Math.min(1, (now - transStartTime) / TRANS_DURATION);
      const fromTxt = (transFrom === "es") ? txt_es : txt_en;
      const toTxt = (transTo === "es") ? txt_es : txt_en;
      html = waveTransform(fromTxt, toTxt, progress);
      if (progress >= 1){
        isTransitioning = false;
      }
    } else {
      const currentTxt = (currentLang === "es") ? txt_es : txt_en;
      html = escapeHtml(currentTxt);
    }

    const key = isTransitioning ? (now + "|" + img + "|" + done) : (currentLang + "|" + html + "|" + img + "|" + done);
    if (key !== last){
      last = key;
      const L = $("#lyrics");
      L.innerHTML = html + (!done ? '<span class="cur"></span>' : '');
      $("#art").textContent = (typeof ART !== "undefined" && img && ART[img]) ? ART[img].join("\n") : "";
    }
  }
  requestAnimationFrame(frame);
}

$("#start").addEventListener("click", () => {
  // 1. Oculta y remueve la pantalla de inicio inmediatamente
  const startScreen = $("#start");
  if (startScreen) startScreen.remove();

  // 2. Inicia el contador de tiempo visual al instante
  t0 = performance.now();

  // 3. Reproduce la música aplicando el retraso configurado
  if (audioOk) {
    setTimeout(() => {
      audio.play().catch(() => { audioOk = false; });
    }, AUDIO_DELAY_MS);
  }

  // 4. Muestra el botón de traducir suavemente según el tiempo configurado en BUTTON_DELAY_MS
  setTimeout(() => {
    const langContainer = $("#lang-container");
    langContainer.style.display = "flex";
    langContainer.offsetHeight; // Forzar reflow para activar la animación de opacidad
    langContainer.classList.add("show");
  }, BUTTON_DELAY_MS);

  // 5. Arranca el bucle de renderizado de la letra
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
