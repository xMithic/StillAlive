<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Still Alive</title>
<style>
  :root{--fg:#ffb000;--bg:#000}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:"Courier New",Consolas,monospace;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;text-shadow:0 0 5px rgba(255,176,0,.55)}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px)}
  #screen{display:grid;grid-template-columns:51ch 51ch;grid-template-rows:16em 20em;
    line-height:1;font-size:var(--fs,16px)}
  pre{margin:0;font:inherit;line-height:1}
  #lyrics{grid-row:1/3;border:1px solid var(--fg);padding:1em 1ch;overflow:hidden}
  #credits{border:1px solid var(--fg);border-left:0}
  #art{padding-left:6ch;padding-top:0}
  .cur{display:inline-block;width:1ch;height:1em;vertical-align:text-bottom;background:var(--fg);
    animation:b 1s steps(1) infinite}
  @keyframes b{50%{opacity:0}}
  #start{position:fixed;inset:0;z-index:5;background:#000;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:1em;cursor:pointer;text-align:center}
  #start b{letter-spacing:.25em;font-size:1.5rem}
  #start small{opacity:.65}
</style>
</head>
<body>
<div id="start"><b>CONTINUAR</b><span>[ para iniciar ]</span><small id="warn"></small></div>
<div id="screen">
  <pre id="lyrics"></pre>
  <pre id="credits"></pre>
  <pre id="art"></pre>
</div>
<audio id="song" src="still-alive.flac" preload="auto"></audio>
<script src="art.js"></script>
<script src="lyrics.js"></script>
<script>
/* Ajustes (también por URL: ?offset=500&speed=1.02&audioDelay=1500)
   OFFSET_MS: retraso general de sincronización
   AUDIO_DELAY_MS: milisegundos de retraso para que empiece a sonar la música */
const q = new URLSearchParams(location.search);
const OFFSET_MS = +(q.get("offset") ?? 0);
const AUDIO_DELAY_MS = +(q.get("audioDelay") ?? 5000); // Cambia este valor para ajustar el retraso de la música

const $ = s => document.querySelector(s);
const audio = $("#song");
let audioOk = true;
audio.addEventListener("error", () => { audioOk = false; $("#warn").textContent = "No se encontró still-alive.flac (se mostrará solo la letra)"; });

/* Escala el tamaño para que los caracteres quepan en pantalla */
function fit(){
  const fs = Math.min(16, innerWidth / 104 / 0.6, innerHeight / 38);
  $("#screen").style.setProperty("--fs", fs + "px");
}
addEventListener("resize", fit); fit();

/* Cuadro de créditos */
function put(grid,r,c,s){ grid[r] = grid[r].slice(0,c) + s + grid[r].slice(c+s.length); }
(function(){
  const g = Array.from({length:16}, () => " ".repeat(49));
  put(g,2,14,"PORTAL - STILL ALIVE");
  put(g,4,10,"Played by motherboard buzzer");
  put(g,13,1,"Based on still-alive by Dmitry Kotov");
  put(g,14,1,"Original code by CATDIMA (GPL-3.0)");
  $("#credits").textContent = g.join("\n");
})();

/* Línea de tiempo */
let total = 0;
const ev = lyrics.map(e => {
  let text = e.text, image = null, clear = false, m;
  while (true) {
    if ((m = /^\u0001(\w+)\u0002/.exec(text))) { image = m[1]; text = text.slice(m[0].length); }
    else if (text[0] === "\u0003") { clear = true; text = text.slice(1); }
    else break;
  }
  const o = { text, image, clear, start: total, dur: e.ms * SPEED_VAL() };
  total += o.dur; return o;
});
function SPEED_VAL(){ return +(q.get("speed") ?? 1); }

function render(t){
  let from = 0, img = null, out = "";
  for (let i = 0; i < ev.length && ev[i].start <= t; i++){
    if (ev[i].clear) from = i;
    if (ev[i].image) img = ev[i].image;
  }
  for (let i = from; i < ev.length && ev[i].start <= t; i++){
    const e = ev[i], n = e.text.length;
    if (n) out += e.text.slice(0, Math.min(n, Math.floor((t - e.start) / (e.dur / n)) + 1));
  }
  return [out, img];
}

let t0 = 0, last = "";
function frame(now){
  // Tiempo basado en el reloj interno del navegador desde que se hizo clic
  const elapsed = now - t0;
  const t = elapsed - OFFSET_MS;
  const done = t > total;
  
  if (t >= 0){
    const [txt, img] = render(t);
    const key = txt + "|" + img + "|" + done;
    if (key !== last){
      last = key;
      const L = $("#lyrics"); L.textContent = txt;
      if (!done){ const c = document.createElement("span"); c.className = "cur"; L.appendChild(c); }
      $("#art").textContent = img && ART[img] ? ART[img].join("\n") : "";
    }
  }
  requestAnimationFrame(frame);
}

$("#start").addEventListener("click", () => {
  // 1. Oculta y remueve la pantalla de inicio inmediatamente
  $("#start.remove")?.remove();
  const startScreen = $("#start");
  if (startScreen) startScreen.remove();

  // 2. Inicia el contador de tiempo visual al instante
  t0 = performance.now();

  // 3. Reproduce la música aplicando el retraso configurado mediante setTimeout
  if (audioOk) {
    setTimeout(() => {
      audio.play().catch(() => { audioOk = false; });
    }, AUDIO_DELAY_MS);
  }

  // 4. Arranca el bucle de renderizado de la letra
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
