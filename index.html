<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PORTAL - STILL ALIVE</title>
<style>
  :root{--fg:#ffb000;--bg:#050400}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Courier New",monospace}
  body{display:flex;align-items:center;justify-content:center;
       text-shadow:0 0 6px rgba(255,176,0,.6)}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;
       background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
  #screen{display:grid;grid-template-columns:51ch 51ch;grid-template-rows:16em 1fr;
          font-size:min(1.6vw,16px);line-height:1.15;max-width:100vw}
  #lyrics{grid-row:1/3;border-left:1px solid;border-right:1px solid;border-top:1px solid;
          border-bottom:1px solid;padding:1.2em 1.5ch;height:36em;white-space:pre;overflow:hidden}
  #credits{border-right:1px solid;border-top:1px solid;border-bottom:1px solid;padding:1em 2ch;white-space:pre}
  #art{white-space:pre;padding:0 4ch;line-height:1.05}
  .cursor{display:inline-block;width:1ch;background:var(--fg);animation:b 1s steps(1) infinite}
  @keyframes b{50%{opacity:0}}
  #start{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
         align-items:center;justify-content:center;gap:1em;cursor:pointer;z-index:9;font-size:1.2rem}
  #start b{font-size:1.6rem;letter-spacing:.2em}
  #start small{opacity:.7}
  @media (max-width:900px){#screen{font-size:1.45vw}}
</style>
</head>
<body>
<div id="start"><b>PORTAL — STILL ALIVE</b><span>[ clic para iniciar ]</span><small id="msg">cargando…</small></div>
<div id="screen">
  <div id="lyrics"></div>
  <div id="credits"><div id="ctitle"></div></div>
  <div id="art"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const CREDITS = "\n\n               PORTAL - STILL ALIVE\n\n           Played by a square-wave oscillator\n";
let data = null, ready = false;

fetch("song.json").then(r => r.json()).then(d => {
  data = d; ready = true; $("#msg").textContent = "listo";
}).catch(() => $("#msg").textContent = "No se encontró song.json (ejecuta convert.py)");

// ---- timeline de la letra: cada evento empieza cuando termina el anterior
function buildTimeline() {
  let t = 0;
  data.lyrics.forEach(e => { e.start = t; t += e.duration; });
  return t;
}

// ---- audio: onda cuadrada, como el buzzer de la placa base
function playNotes(ctx) {
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = "square"; g.gain.value = 0;
  osc.connect(g).connect(ctx.destination);
  let t = ctx.currentTime + 0.15;
  const t0 = t;
  data.notes.forEach(([f, ms]) => {
    const d = ms / 1000;
    if (f > 0) {
      osc.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.12, t);
      g.gain.setValueAtTime(0, t + d - 0.012);   // pequeño corte entre notas iguales
    } else g.gain.setValueAtTime(0, t);
    t += d;
  });
  osc.start(t0); osc.stop(t + 0.2);
  return t0;
}

// ---- render
function start() {
  if (!ready) return;
  $("#start").remove();
  const total = buildTimeline();
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const audioT0 = playNotes(ctx);
  $("#ctitle").textContent = CREDITS;
  const lyr = $("#lyrics"), art = $("#art");
  let lastKey = "";

  function frame() {
    const t = (ctx.currentTime - audioT0) * 1000;
    if (t < 0) return requestAnimationFrame(frame);
    let shown = "", img = null, from = 0;
    const L = data.lyrics;
    // último CLEAR ya iniciado
    for (let i = 0; i < L.length && L[i].start <= t; i++) if (L[i].clear) from = i;
    for (let i = from; i < L.length && L[i].start <= t; i++) {
      const e = L[i];
      if (e.image) img = e.image;
      const n = e.text.length;
      const k = n ? Math.min(n, Math.floor((t - e.start) / (e.duration / n)) + 1) : 0;
      shown += e.text.slice(0, k);
    }
    for (let i = 0; i < L.length && L[i].start <= t; i++) if (L[i].image) img = L[i].image;
    const done = t >= total;
    const key = shown + "|" + img + "|" + done + "|" + (Math.floor(t / 500) % 2);
    if (key !== lastKey) {
      lastKey = key;
      lyr.textContent = shown;
      if (!done) { const c = document.createElement("span"); c.className = "cursor"; c.textContent = " "; lyr.appendChild(c); }
      art.textContent = img && data.art[img] ? data.art[img].join("\n") : "";
    }
    if (!done) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
$("#start").addEventListener("click", start);
</script>
</body>
</html>
